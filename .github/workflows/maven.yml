name: Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21', '25']
    name: JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Check independent reference implementation
        run: openssl version
      - name: Verify and install local development artifact
        run: mvn -B -ntp clean install -Dopenssl.integration=true
      - name: Compile and run the standalone consumer
        run: bash examples/run.sh -ntp
